<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura No Heya - Menu</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
    <link rel="stylesheet" href="assetts/css/style.css">
    <link rel="stylesheet" href="assetts/css/mainmenu.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div class="menu-container">
        <div class="menu-card">
            <!-- Left Side: Hero -->
            <div class="hero-side">
                <div class="hero-top">
                    <div class="logo-wrap">
                        <div class="logo-glow"></div>
                        <img src="assetts/images/sakuralogo.png" alt="Sakura">
                    </div>
                    <h1 class="hero-title">Hey, <span id="displayName">you</span></h1>
                    <p class="hero-desc">Welcome back to your private room. Everything is exactly as you left it.</p>
                </div>
                <div class="hero-footer">
                    <span>Build 2.4.0</span>
                    <span>Stable</span>
                </div>
            </div>

            <!-- Right Side: Actions -->
            <div class="actions-side">
                <div class="actions-kicker">Ready to proceed?</div>
                
                <button class="btn-main primary" onclick="startQuickMode()">
                    <strong>Quick Chat</strong>
                    <span>Start a fresh conversation</span>
                </button>

                <button class="btn-main" id="storyBtn">
                    <strong>Story Mode</strong>
                    <span>Continue the main narrative</span>
                </button>

                <div class="secondary-actions">
                    <button class="btn-sec" onclick="toggleSettings()">Settings</button>
                    <button class="btn-sec" onclick="exportData()">Backup</button>
                    <button class="btn-sec" onclick="triggerImport()">Import</button>
                    <button class="btn-sec" style="color: #ff85b3;" onclick="window.location.href='index.html'">Logout</button>
                </div>

                <input type="file" id="importFile" style="display:none;" onchange="importData(this)">
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="settings-group">
                <h3>Preferences</h3>
                <div class="setting-row">
                    <label>Dark Interface</label>
                    <input type="checkbox" id="themeToggle">
                </div>
                <div class="setting-row">
                    <label>BGM Ambience</label>
                    <input type="checkbox" id="musicToggle">
                </div>
                <div class="setting-row">
                    <label>SFX Feedback</label>
                    <input type="checkbox" id="sfxToggle">
                </div>
                <div class="setting-row">
                    <label>Developer Mode</label>
                    <input type="checkbox" id="devToggle">
                </div>
            </div>

            <div class="settings-group">
                <h3>AI Personality</h3>
                <textarea id="personalityInput" rows="6" placeholder="Define how Sakura should act..."></textarea>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 20px;">
                <button class="btn-main primary" style="padding: 16px; flex: 1;" onclick="saveSettings()">Save & Close</button>
                <button class="btn-sec" style="flex: 1;" onclick="toggleSettings()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="assetts/js/common.js"></script>
    <script src="assetts/js/mainmenu.js"></script>
</body>
</html>
