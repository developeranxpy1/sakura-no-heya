<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura No Heya</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
    <link rel="stylesheet" href="assetts/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            background-image: none !important;
        }

        .menu-scene {
            position: relative;
            min-height: 100dvh;
            padding: 24px;
            display: grid;
            place-items: center;
            overflow: hidden;
            isolation: isolate;
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.7), transparent 24%),
                linear-gradient(135deg, #fff1f8 0%, #ffd8ea 48%, #fff7d8 100%);
        }

        [data-theme="dark"] .menu-scene {
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.08), transparent 24%),
                linear-gradient(135deg, #080a15 0%, #151124 48%, #251c39 100%);
        }

        .scene-aurora,
        .scene-grid,
        .scene-noise {
            position: absolute;
            pointer-events: none;
        }

        .scene-aurora {
            border-radius: 999px;
            filter: blur(26px);
            opacity: 0.86;
        }

        .aurora-a {
            width: min(44vw, 520px);
            height: min(44vw, 520px);
            top: -12%;
            left: -10%;
            background: radial-gradient(circle, rgba(255, 168, 205, 0.94), rgba(255, 168, 205, 0));
            animation: auroraDrift 12s ease-in-out infinite;
        }

        .aurora-b {
            width: min(30vw, 360px);
            height: min(30vw, 360px);
            right: 8%;
            top: 10%;
            background: radial-gradient(circle, rgba(255, 241, 167, 0.8), rgba(255, 241, 167, 0));
            animation: auroraPulse 8s ease-in-out infinite;
        }

        .aurora-c {
            width: min(36vw, 440px);
            height: min(36vw, 440px);
            right: -4%;
            bottom: -14%;
            background: radial-gradient(circle, rgba(200, 182, 255, 0.84), rgba(200, 182, 255, 0));
            animation: auroraDrift 16s ease-in-out infinite reverse;
        }

        .scene-grid,
        .scene-noise {
            inset: 0;
        }

        .scene-grid {
            z-index: 0;
            opacity: 0.2;
            background:
                linear-gradient(rgba(255, 255, 255, 0.16) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px);
            background-size: 34px 34px;
            mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.9) 38%, rgba(0, 0, 0, 0) 90%);
        }

        [data-theme="dark"] .scene-grid {
            opacity: 0.14;
        }

        .scene-noise {
            z-index: 1;
            opacity: 0.12;
            mix-blend-mode: soft-light;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='160' height='160' filter='url(%23n)' opacity='0.44'/%3E%3C/svg%3E");
        }

        .menu-container {
            width: min(1180px, 100%);
            z-index: 2;
        }

        .menu-card {
            position: relative;
            min-height: min(760px, calc(100dvh - 48px));
            border-radius: 36px;
            overflow: hidden;
        }

        .menu-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -3;
            opacity: 0.4;
            filter: blur(10px) saturate(1.12);
            transform: scale(1.12);
        }

        .menu-wash {
            position: absolute;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(circle at 78% 18%, rgba(255, 255, 255, 0.22), transparent 24%),
                linear-gradient(120deg, rgba(255, 255, 255, 0.18), transparent 38%);
        }

        .menu-content {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 1.12fr) minmax(340px, 0.88fr);
            min-height: inherit;
        }

        .menu-hero,
        .menu-actions {
            min-width: 0;
            position: relative;
        }

        .menu-hero {
            display: flex;
            flex-direction: column;
            gap: 24px;
            justify-content: space-between;
            padding: 36px;
            background:
                radial-gradient(circle at 82% 18%, rgba(255, 255, 255, 0.4), transparent 26%),
                linear-gradient(155deg, rgba(255, 248, 252, 0.8), rgba(255, 255, 255, 0.56));
        }

        [data-theme="dark"] .menu-hero {
            background:
                radial-gradient(circle at 82% 18%, rgba(255, 255, 255, 0.08), transparent 26%),
                linear-gradient(155deg, rgba(24, 27, 49, 0.84), rgba(36, 42, 72, 0.58));
        }

        .menu-hero::after {
            content: "";
            position: absolute;
            right: 0;
            top: 8%;
            bottom: 8%;
            width: 1px;
            background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.48), transparent);
        }

        .hero-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .hero-badge,
        .settings-close,
        .settings-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.42);
            color: var(--text-color);
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        [data-theme="dark"] .hero-badge,
        [data-theme="dark"] .settings-close,
        [data-theme="dark"] .settings-pill {
            color: var(--text-color);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.14);
        }

        .hero-badge.subtle {
            border-style: dashed;
            background: rgba(255, 255, 255, 0.18);
        }

        .hero-logo-wrap {
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .menu-logo {
            width: min(320px, 74%);
            max-width: 320px;
            height: auto;
            filter: drop-shadow(0 16px 22px rgba(0, 0, 0, 0.16));
        }

        .hero-copy {
            max-width: 44ch;
        }

        .hero-kicker,
        .actions-kicker,
        .settings-kicker,
        .session-label,
        .action-tag,
        .section-label {
            margin: 0 0 10px 0;
            font-family: "Courier New", Courier, monospace;
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(89, 74, 78, 0.64);
        }

        [data-theme="dark"] .hero-kicker,
        [data-theme="dark"] .actions-kicker,
        [data-theme="dark"] .settings-kicker,
        [data-theme="dark"] .session-label,
        [data-theme="dark"] .action-tag,
        [data-theme="dark"] .section-label {
            color: rgba(224, 224, 224, 0.56);
        }

        .hero-title {
            margin: 0;
            max-width: 10ch;
            font-size: clamp(3rem, 7vw, 5.8rem);
            line-height: 0.9;
            letter-spacing: -0.06em;
        }

        .hero-title span {
            color: var(--secondary-color);
        }

        .hero-description,
        .actions-copy,
        .settings-copy,
        .hero-note {
            margin: 0;
            line-height: 1.65;
            color: rgba(89, 74, 78, 0.84);
        }

        [data-theme="dark"] .hero-description,
        [data-theme="dark"] .actions-copy,
        [data-theme="dark"] .settings-copy,
        [data-theme="dark"] .hero-note {
            color: rgba(224, 224, 224, 0.78);
        }

        .session-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        .session-card {
            padding: 16px 18px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.42);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.36);
        }

        [data-theme="dark"] .session-card {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: none;
        }

        .session-label {
            display: block;
        }

        .session-card strong {
            display: block;
            font-size: 1rem;
            line-height: 1.25;
        }

        .menu-actions {
            display: flex;
            flex-direction: column;
            gap: 22px;
            padding: 36px;
            background:
                radial-gradient(circle at top right, rgba(255, 255, 255, 0.1), transparent 28%),
                linear-gradient(180deg, rgba(121, 55, 93, 0.95), rgba(99, 45, 76, 0.9));
            color: #ffffff;
        }

        [data-theme="dark"] .menu-actions {
            background:
                radial-gradient(circle at top right, rgba(255, 255, 255, 0.06), transparent 28%),
                linear-gradient(180deg, rgba(13, 16, 31, 0.95), rgba(20, 24, 42, 0.92));
        }

        .actions-copy {
            color: rgba(255, 255, 255, 0.78);
        }

        .action-stack {
            display: grid;
            gap: 14px;
        }

        .menu-action,
        .utility-btn {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            text-align: left;
            padding: 18px 20px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: transform 0.18s ease, border-color 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
        }

        .menu-action:hover:not(.is-disabled),
        .utility-btn:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.28);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 18px 26px rgba(0, 0, 0, 0.14);
        }

        .menu-action strong {
            display: block;
            font-size: 1.28rem;
            line-height: 1.12;
            margin-bottom: 6px;
        }

        .menu-action small {
            display: block;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.74);
        }

        .menu-action.primary {
            background: linear-gradient(135deg, rgba(255, 216, 111, 0.24), rgba(255, 110, 169, 0.18));
            border-color: rgba(255, 216, 111, 0.3);
        }

        .menu-action.primary strong {
            color: #fff3b4;
        }

        .menu-action.is-disabled,
        .menu-action:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            filter: saturate(0.55);
        }

        .utility-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin-top: auto;
        }

        .utility-btn {
            min-height: 62px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 700;
        }

        .utility-btn.danger {
            color: #ffd1d1;
        }

        .settings-modal {
            position: absolute;
            inset: 0;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transform: translateY(14px);
            transition: opacity 0.28s ease, transform 0.28s ease;
            background:
                linear-gradient(180deg, rgba(255, 248, 252, 0.96), rgba(255, 240, 248, 0.92));
            color: var(--text-color);
        }

        [data-theme="dark"] .settings-modal {
            background:
                linear-gradient(180deg, rgba(12, 15, 30, 0.98), rgba(18, 22, 40, 0.94));
        }

        .settings-modal.active {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0);
        }

        .settings-shell {
            height: 100%;
            padding: 28px;
            overflow-y: auto;
            display: grid;
            gap: 18px;
        }

        .settings-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            flex-wrap: wrap;
        }

        .settings-title h2 {
            margin: 4px 0 6px;
            font-size: 2.3rem;
            line-height: 1;
        }

        .settings-title span {
            color: rgba(89, 74, 78, 0.76);
        }

        [data-theme="dark"] .settings-title span {
            color: rgba(224, 224, 224, 0.72);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            align-items: start;
        }

        .settings-section {
            padding: 20px;
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.48);
            border: 1px solid rgba(255, 255, 255, 0.52);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.34);
        }

        [data-theme="dark"] .settings-section {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: none;
        }

        .settings-section h3 {
            margin: 0 0 6px;
            font-size: 1.2rem;
        }

        .setting-list {
            display: grid;
            gap: 14px;
            margin-top: 16px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-color);
        }

        .settings-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 18px;
        }

        .settings-actions .btn-candy,
        .settings-actions .btn-candy-red {
            flex: 1;
            min-width: 160px;
        }

        .btn-muted {
            background: var(--glass-bg);
            color: var(--text-color);
            border-color: var(--border-color);
            box-shadow: 0 5px 0 var(--border-color);
        }

        .field-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(89, 74, 78, 0.68);
        }

        [data-theme="dark"] .field-label {
            color: rgba(224, 224, 224, 0.62);
        }

        .settings-modal textarea {
            margin-bottom: 0;
            min-height: 180px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 80px;
            height: 36px;
        }

        .switch input {
            display: none;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: var(--btn-bg);
            border: 2px solid var(--border-color);
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 3px;
            bottom: 3px;
            background-color: #ffffff;
            transition: .4s;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.12);
        }

        input:checked + .slider {
            background-color: var(--border-color);
        }

        input:checked + .slider:before {
            transform: translateX(44px);
        }

        .file-list {
            display: grid;
            gap: 10px;
            margin-top: 16px;
        }

        .file-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.46);
            border: 1px solid rgba(255, 255, 255, 0.48);
        }

        [data-theme="dark"] .file-entry {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .file-meta strong {
            display: block;
            font-size: 0.95rem;
        }

        .file-meta span {
            display: block;
            margin-top: 4px;
            font-size: 0.75rem;
            color: rgba(89, 74, 78, 0.7);
        }

        [data-theme="dark"] .file-meta span {
            color: rgba(224, 224, 224, 0.62);
        }

        .file-edit-btn {
            border: none;
            border-radius: 12px;
            padding: 10px 14px;
            background: var(--border-color);
            color: #ffffff;
            font-weight: 700;
        }

        .file-empty {
            margin-top: 14px;
            color: rgba(89, 74, 78, 0.7);
        }

        [data-theme="dark"] .file-empty {
            color: rgba(224, 224, 224, 0.62);
        }

        .json-editor-modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(15, 12, 24, 0.34);
            backdrop-filter: blur(8px);
        }

        .json-editor-shell {
            width: min(760px, 100%);
            padding: 24px;
            display: grid;
            gap: 16px;
        }

        .json-editor-header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .json-editor-header h3 {
            margin: 4px 0 0;
            font-size: 1.6rem;
        }

        .json-editor-textarea {
            width: 100%;
            min-height: 360px;
            margin: 0;
            font-family: Consolas, "Courier New", monospace;
            resize: vertical;
        }

        .json-editor-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .json-editor-actions .btn-candy {
            flex: 1;
            min-width: 160px;
        }

        @keyframes auroraDrift {
            0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
            50% { transform: translate3d(24px, -18px, 0) scale(1.05); }
        }

        @keyframes auroraPulse {
            0%, 100% { transform: scale(1); opacity: 0.82; }
            50% { transform: scale(1.08); opacity: 1; }
        }

        @media (max-width: 1024px) {
            .menu-content {
                grid-template-columns: 1fr;
            }

            .menu-hero::after {
                display: none;
            }

            .utility-grid,
            .session-grid,
            .settings-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 720px) {
            .menu-scene {
                padding: 16px;
            }

            .menu-card {
                min-height: auto;
            }

            .menu-hero,
            .menu-actions,
            .settings-shell,
            .json-editor-shell {
                padding: 22px;
            }

            .hero-title {
                font-size: clamp(2.5rem, 14vw, 4.3rem);
            }

            .menu-logo {
                width: min(250px, 70%);
            }

            .hero-badges,
            .settings-toolbar,
            .json-editor-header {
                align-items: flex-start;
            }
        }

        @media (max-width: 520px) {
            .settings-actions .btn-candy,
            .settings-actions .btn-candy-red,
            .json-editor-actions .btn-candy {
                min-width: 100%;
            }

            .switch {
                width: 64px;
                height: 32px;
            }

            .slider:before {
                width: 22px;
                height: 22px;
            }

            input:checked + .slider:before {
                transform: translateX(30px);
            }
        }

        /* Existing markup VN override */
        html, body {
            min-height: 100%;
            height: auto !important;
            overflow: auto !important;
        }

        body {
            position: relative;
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.74), transparent 24%),
                linear-gradient(135deg, #fff1f8 0%, #ffd8ea 48%, #fff7d8 100%) !important;
            background-image:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.74), transparent 24%),
                linear-gradient(135deg, #fff1f8 0%, #ffd8ea 48%, #fff7d8 100%) !important;
        }

        [data-theme="dark"] body {
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.08), transparent 24%),
                linear-gradient(135deg, #080a15 0%, #151124 48%, #251c39 100%) !important;
            background-image:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.08), transparent 24%),
                linear-gradient(135deg, #080a15 0%, #151124 48%, #251c39 100%) !important;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 999px;
            filter: blur(28px);
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            width: min(44vw, 520px);
            height: min(44vw, 520px);
            top: -12%;
            left: -10%;
            background: radial-gradient(circle, rgba(255, 168, 205, 0.94), rgba(255, 168, 205, 0));
        }

        body::after {
            width: min(36vw, 440px);
            height: min(36vw, 440px);
            right: -4%;
            bottom: -14%;
            background: radial-gradient(circle, rgba(200, 182, 255, 0.84), rgba(200, 182, 255, 0));
        }

        .menu-container {
            position: relative;
            z-index: 1;
            min-height: 100dvh;
            width: 100%;
            padding: clamp(16px, 3vw, 28px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
        }

        .menu-card {
            width: min(680px, 100%);
            min-height: auto;
            overflow: hidden !important;
            border-width: 1px !important;
            border-color: rgba(255, 255, 255, 0.38) !important;
            border-radius: 38px !important;
            box-shadow: 0 34px 90px rgba(120, 54, 86, 0.22) !important;
            background: rgba(255, 248, 252, 0.72) !important;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        [data-theme="dark"] .menu-card {
            background: rgba(18, 22, 40, 0.78) !important;
            box-shadow: 0 34px 90px rgba(0, 0, 0, 0.38) !important;
            border-color: rgba(255, 255, 255, 0.12) !important;
        }

        .menu-card::before {
            content: attr(data-access);
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 3;
            min-height: 38px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.44);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: var(--text-color);
            font-family: "Courier New", Courier, monospace;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

    <script src="assetts/js/common.js"></script>
    <script>
        // Check Auth using correct cookie
        if (!Common.getCookie('username')) {
            window.location.href = 'index.html';
        }

        let currentEditingFile = null;

        function escapeHTML(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function refreshMenuPresentation() {
            const menuCard = document.querySelector('.menu-card');
            const header = document.querySelector('.card-header-logo');
            const storyBtn = document.getElementById('storyBtn');
            const username = Common.getCookie('username');
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const devModeEnabled = document.getElementById('devToggle').checked === true;
            const accessLabel = devModeEnabled ? 'Developer route unlocked' : 'Quick route ready';
            const paletteLabel = isDark ? 'Night palette' : 'Rose palette';
            const signedInLabel = username ? `Signed in as ${username}.` : 'Signed in.';

            if (menuCard) {
                menuCard.dataset.access = `${accessLabel} | ${paletteLabel}`;
            }

            if (header) {
                header.dataset.userline = devModeEnabled
                    ? `${signedInLabel} Story Mode is unlocked for desktop route access and persistence testing.`
                    : `${signedInLabel} Quick Start is stable and ready; enable Developer Mode in Settings to unlock Story Mode.`;
            }

            if (storyBtn) {
                storyBtn.dataset.storyhint = devModeEnabled
                    ? 'Full desktop route unlocked for scene and persistence testing.'
                    : 'Locked behind Developer Mode so the live route stays stable for regular play.';
                storyBtn.title = storyBtn.dataset.storyhint;
                storyBtn.setAttribute('aria-disabled', String(storyBtn.disabled));
            }
        }

        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.classList.toggle('active');
            
            if (panel.classList.contains('active')) {
                updateFileList();
            }
        }

        function updateFileList() {
            const list = document.getElementById('fileList');
            const prefix = 'delta_os_';
            const files = [];

            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith(prefix)) {
                    const filename = key.replace(prefix, '');
                    let meta = "Unknown Date";
                    let sortOrder = 0;
                    try {
                        const data = JSON.parse(localStorage.getItem(key));
                        if (data && data.createdAt) {
                            const date = new Date(data.createdAt);
                            meta = date.toLocaleString();
                        }
                    } catch(e) {}
                    
                    content += `<li style="margin-bottom:10px; background: var(--btn-bg); padding: 8px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <span style="color:var(--btn-text); font-weight:bold;">${filename}</span><br>
                            <span style="font-size:0.7rem; color:var(--btn-text); opacity: 0.7;">${meta}</span>
                        </div>
                        <button onclick="editFile('${filename}')" style="background: var(--border-color); border: none; border-radius: 5px; cursor: pointer; padding: 5px 10px; font-size: 1rem;">✏️</button>
                    </li>`;
                }
            }
            content += "</ul>";
            
            if (found) {
                list.innerHTML = content;
            } else {
                list.innerHTML = "No persistent files found.";
            }
        }

        function editFile(filename) {
            currentEditingFile = filename;
            const data = Common.loadState(filename);
            
            document.getElementById('editFileName').innerText = filename;
            document.getElementById('jsonContent').value = JSON.stringify(data, null, 2); // Pretty print
            document.getElementById('jsonEditor').style.display = 'flex';
        }

        function closeEditor() {
            document.getElementById('jsonEditor').style.display = 'none';
            currentEditingFile = null;
        }

        function saveJSON() {
            if (!currentEditingFile) return;
            
            try {
                const raw = document.getElementById('jsonContent').value;
                const parsed = JSON.parse(raw);
                
                // Save using Common (handles cookie sync for general.json too!)
                Common.saveState(currentEditingFile, parsed);
                
                alert("Saved!");
                closeEditor();
                updateFileList();
                
                // If we edited general settings, reload them right away to verify
                if (currentEditingFile === 'general.json') {
                    if (parsed.personality !== undefined) document.getElementById('personalityInput').value = parsed.personality;
                    if (parsed.music !== undefined) document.getElementById('musicToggle').checked = parsed.music;
                    if (parsed.sfx !== undefined) document.getElementById('sfxToggle').checked = parsed.sfx;
                    if (parsed.theme !== undefined) {
                        const isDark = (parsed.theme === 'dark');
                        document.getElementById('themeToggle').checked = isDark;
                        toggleTheme(isDark);
                    }
                    // Apply theme globally (backup)
                    Common.initTheme();
                }

            } catch (e) {
                alert("Invalid JSON! Please check syntax.\n" + e.message);
            }
        }

        function logout() {
            Common.setCookie('username', '', -1);
            Common.setCookie('key', '', -1);
            window.location.href = 'index.html';
        }

        function clearData() {
            if(confirm("Are you sure? This will delete all your settings, history, and mood data.")) {
                localStorage.clear();
                // Also clear the persistence cookie
                Common.setCookie('delta_settings', '', -1);
                logout();
            }
        }

        function saveSettings(shouldClose = false) {
            const isDark = document.getElementById('themeToggle').checked;
            const music = document.getElementById('musicToggle').checked;
            const sfx = document.getElementById('sfxToggle').checked;
            const devMode = document.getElementById('devToggle').checked;
            const personality = document.getElementById('personalityInput').value.trim();

            // Load existing to preserve 'createdAt' or other metadata
            let current = Common.loadState('general.json') || {};
            current.theme = isDark ? 'dark' : 'light';
            current.music = music;
            current.sfx = sfx;
            current.devMode = devMode;
            current.personality = personality;

            Common.saveState('general.json', current);
            Common.initTheme(); // Apply immediately
            applyDevMode(devMode); // Apply dev mode immediately
            
            if (shouldClose) {
                toggleSettings();
            }
        }

        function applyDevMode(isEnabled) {
            const btn = document.getElementById('storyBtn');
            if (isEnabled) {
                btn.disabled = false;
                btn.style.opacity = '1';
                btn.style.cursor = 'pointer';
                btn.style.background = ''; // Reverts to CSS default or class
                btn.style.borderColor = '';
                btn.style.color = '';
                btn.innerHTML = '<span>📖</span> Story Mode';
                btn.onclick = function() { window.location.href = 'desktopui.html'; };
            } else {
                btn.disabled = true;
                btn.style.opacity = '0.6';
                btn.style.cursor = 'not-allowed';
                btn.style.background = '#f9f9f9';
                btn.style.borderColor = '#ddd';
                btn.style.color = '#aaa';
                btn.innerHTML = '<span>📖</span> Story Mode';
                btn.onclick = null;
            }
        }

        function toggleTheme(isDark) {
            const theme = isDark ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', theme);
        }

        // Default Character Description (Sync with Quickmode)
        const DEFAULT_PERSONALITY = `You are Sakura.
You are shy, soft-spoken, and formal. You hesitate, overthink, and apologize.
You enjoy literature and atmosphere. You DO NOT sound poetic unless emotional.
You never mention being AI. You control the background/Visual Novel elements.`;

        // Load Settings
        let settings = Common.loadState('general.json') || {};
        if (settings) {
            if (settings.theme === 'dark') {
                document.getElementById('themeToggle').checked = true;
                toggleTheme(true);
            }
            document.getElementById('musicToggle').checked = (settings.music !== false);
            document.getElementById('sfxToggle').checked = (settings.sfx !== false);
            if (settings.devMode) {
                document.getElementById('devToggle').checked = true;
                applyDevMode(true);
            }
            
            // Sync with Quickmode logic (handling both keys and stripping JSON)
            let savedPersonality = settings.personality || settings.prompt; 
            if (!savedPersonality) {
                savedPersonality = DEFAULT_PERSONALITY;
            } else if (savedPersonality.includes("OUTPUT FORMAT: Return JSON ONLY")) {
                savedPersonality = savedPersonality.split("OUTPUT FORMAT")[0].trim();
            }
            
            
            document.getElementById('personalityInput').value = savedPersonality;
        }

        async function startQuickMode() {
            window.location.href = 'loading.html?target=quickmode';
        }

        /* --- IMPORT / EXPORT LOGIC --- */
        async function exportData() {
            const zip = new JSZip();
            let count = 0;
            
            // 1. Gather all branded localstorage items
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('delta_os_')) {
                    zip.file(key, localStorage.getItem(key));
                    count++;
                }
            }
            
            // 2. Also export cookies (username/key) as a JSON
            const creds = {
                username: Common.getCookie('username'),
                key: Common.getCookie('key')
            };
            zip.file('credentials.json', JSON.stringify(creds));

            if (count === 0) {
                alert("No data to export!");
                return;
            }

            // Timestamp Format: sakuranh-YYYY-MM-DD-HH-MM
            const now = new Date();
            const dateStr = now.toISOString().slice(0,10); // YYYY-MM-DD
            const timeStr = now.toTimeString().slice(0,5).replace(':', '-'); // HH-MM
            const filename = `sakuranh-${dateStr}-${timeStr}.zip`;

            const blob = await zip.generateAsync({type:"blob"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function triggerImport() {
            document.getElementById('importFile').click();
        }

        async function importData(input) {
            const file = input.files[0];
            if (!file) return;

            try {
                const zip = await JSZip.loadAsync(file);
                let imported = 0;

                for (const filename of Object.keys(zip.files)) {
                    const content = await zip.file(filename).async("string");
                    
                    if (filename === 'credentials.json') {
                         try {
                             const creds = JSON.parse(content);
                             if(creds.username) Common.setCookie('username', creds.username, 30);
                             if(creds.key) Common.setCookie('key', creds.key, 30);
                         } catch(e) {}
                    } else if (filename.startsWith('delta_os_')) {
                        localStorage.setItem(filename, content);
                        imported++;
                    }
                }
                
                alert(`Imported ${imported} files successfully! Reloading...`);
                window.location.reload(); 

            } catch (e) {
                alert("Import failed! Invalid zip." + e);
            }
        }
    </script>
    
</body>
</html>
