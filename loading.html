<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Sakura...</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 10 C35 25 50 32 60 32 C50 32 35 39 32 54 C29 39 14 32 4 32 C14 32 29 25 32 10' fill='%23ff85b3'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="assetts/css/style.css">
    <link rel="stylesheet" href="assetts/css/loading.css">
</head>
<body>
    <main class="loader-shell" id="loadingShell">
        <div class="logo-container">
            <div class="logo-glow"></div>
            <img src="assetts/images/sakuralogo.png" alt="Sakura Logo">
        </div>

        <div class="status-info">
            <h1 class="hero-title" id="heroTitle">
                <span id="heroLead">Loading</span>
                <span id="displayName" style="display:none;"></span> <!-- Hidden but kept for JS compatibility -->
                <span id="loaderEyebrow" style="display:none;"></span>
                <span id="heroCopy" style="display:none;"></span>
                <span id="themeLabel" style="display:none;"></span>
                <span id="destinationLabel" style="display:none;"></span>
                <span id="assetCountLabel" style="display:none;"></span>
                <span id="phaseChip" style="display:none;"></span>
            </h1>
            <p id="statusText">Initializing startup sequence...</p>
            <p id="statusNote" style="display:none;"></p>
        </div>

        <div class="progress-container">
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-bottom">
                <span id="elapsedTime">00:00</span>
                <span id="progressPercent">0%</span>
            </div>
        </div>

        <!-- Safety Fallback -->
        <a href="mainmenu.html" class="manual-link" id="safetyLink">Skip Loading</a>
    </main>

    <script src="assetts/js/common.js"></script>
    <script src="assetts/js/loading.js"></script>
</body>
</html>
